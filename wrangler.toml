name = "closedbook"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# --- D1: relational data (projects, questions, attempts, grades, gaps) ---
# Create with: wrangler d1 create closedbook
# Then replace database_id with the real one.
[[d1_databases]]
binding = "DB"
database_name = "closedbook"
database_id = "00000000-0000-0000-0000-000000000000"

# --- R2: original source files (textbooks, papers, slides) ---
# Create with: wrangler r2 bucket create closedbook-sources
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "closedbook-sources"

# --- Vectorize: chunk embeddings for source-grounded retrieval ---
# Create with: wrangler vectorize create closedbook-chunks --dimensions=1024 --metric=cosine
# (dimensions must match EMBEDDING_MODEL)
[[vectorize]]
binding = "VECTORIZE"
index_name = "closedbook-chunks"

[vars]
# BYOK: any OpenAI-compatible endpoint works (official APIs or gateways).
LLM_BASE_URL = "https://api.openai.com/v1"
LLM_MODEL = "gpt-4o"
EMBEDDING_MODEL = "multilingual-e5-large"
# LLM_API_KEY is a secret. Never put it here.
#   local: copy .dev.vars.example to .dev.vars
#   prod : wrangler secret put LLM_API_KEY
