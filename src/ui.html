<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClosedBook</title>
<link rel="stylesheet" href="/assets/css_variables.css">
<link rel="stylesheet" href="/assets/fundamental-styles.css">
<style>
  body { margin: 0; background: var(--sapBackgroundColor, #f7f7f7); }
  .cb-main { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .cb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  .cb-card-body { padding: 1rem; }
  .cb-steps { display: flex; gap: 0.25rem; flex-wrap: wrap; margin: 1rem 0; }
  .cb-step { flex: 1 1 7rem; text-align: center; padding: 0.45rem 0.25rem; border-radius: 0.5rem;
             background: var(--sapList_Background, #fff); border: 1px solid var(--sapList_BorderColor, #d9d9d9);
             color: var(--sapContent_LabelColor, #6a6d70); font-size: 0.875rem; }
  .cb-step.done { background: var(--sapPositiveColor, #107e3e); border-color: transparent; color: #fff; }
  .cb-step.current { border-color: var(--sapHighlightColor, #0a6ed1); color: var(--sapHighlightColor, #0a6ed1); font-weight: 700; }
  .cb-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .cb-layer { margin: 1.25rem 0 0.5rem; font-size: 1rem; }
  .cb-node { margin-bottom: 0.5rem; }
  .cb-cite { display: inline-block; margin: 0.15rem 0.25rem 0 0; padding: 0.05rem 0.5rem; border-radius: 1rem;
             background: var(--sapInformationBackground, #eaf3fc); color: var(--sapInformationColor, #0a6ed1); font-size: 0.75rem; }
  .cb-q { margin-bottom: 1rem; }
  .cb-score { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 0; border-bottom: 1px solid var(--sapList_BorderColor, #eee); }
  .cb-detail { white-space: pre-line; }
  .cb-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin: 0.75rem 0; }
  .cb-hidden { display: none !important; }
  .cb-muted { color: var(--sapContent_LabelColor, #6a6d70); }
  .cb-lockbar { margin-bottom: 1rem; }
  textarea.fd-textarea { width: 100%; min-height: 7rem; }
  .fd-card { cursor: default; }
  .cb-clickable { cursor: pointer; }
</style>
</head>
<body>
<header class="fd-shellbar">
  <div class="fd-shellbar__group fd-shellbar__group--product">
    <span class="fd-shellbar__product"><span class="fd-shellbar__product-name">ClosedBook</span></span>
  </div>
</header>

<main class="cb-main">
  <div id="cb-error" class="fd-message-strip fd-message-strip--negative cb-hidden" role="alert"></div>

  <!-- Projects -->
  <section id="view-projects">
    <h1 class="fd-title fd-title--h1">分野</h1>
    <form id="form-project" class="cb-actions">
      <input id="input-project-name" class="fd-input" type="text" placeholder="新しい分野の名前" style="max-width:20rem" required>
      <button class="fd-button fd-button--emphasized" type="submit">作成</button>
    </form>
    <div id="project-list" class="cb-grid"></div>
  </section>

  <!-- Project -->
  <section id="view-project" class="cb-hidden">
    <button id="btn-back" class="fd-button fd-button--transparent">← 分野一覧</button>
    <h1 id="project-name" class="fd-title fd-title--h1"></h1>
    <div id="phase-steps" class="cb-steps"></div>

    <ul class="fd-tabs" role="tablist">
      <li class="fd-tabs__item"><a class="fd-tabs__link" data-tab="sources" role="tab">資料</a></li>
      <li class="fd-tabs__item"><a class="fd-tabs__link" data-tab="map" role="tab">骨格</a></li>
      <li class="fd-tabs__item"><a class="fd-tabs__link" data-tab="controversies" role="tab">論争</a></li>
      <li class="fd-tabs__item"><a class="fd-tabs__link" data-tab="test" role="tab">テスト</a></li>
      <li class="fd-tabs__item"><a class="fd-tabs__link" data-tab="gaps" role="tab">穴</a></li>
    </ul>

    <div id="tab-sources" class="cb-tabpanel">
      <form id="form-source" class="cb-actions">
        <input id="input-source-title" class="fd-input" type="text" placeholder="資料のタイトル（任意）" style="max-width:16rem">
        <input id="input-source-file" class="fd-input" type="file" accept=".md,.txt,.markdown" required>
        <button class="fd-button fd-button--emphasized" type="submit">取り込む</button>
      </form>
      <div id="source-list"></div>
    </div>

    <div id="tab-map" class="cb-tabpanel cb-hidden">
      <div class="cb-actions">
        <button id="btn-phase1" class="fd-button fd-button--emphasized">骨格を作る</button>
      </div>
      <div id="map-view"></div>
    </div>

    <div id="tab-controversies" class="cb-tabpanel cb-hidden">
      <div class="cb-actions">
        <button id="btn-phase2" class="fd-button fd-button--emphasized">論争を検出する</button>
      </div>
      <div id="controversy-view"></div>
    </div>

    <div id="tab-test" class="cb-tabpanel cb-hidden">
      <div id="lockbar" class="fd-message-strip fd-message-strip--warning cb-lockbar cb-hidden">
        資料ロック中。回答が終わるまで資料は開けない。
      </div>
      <div class="cb-actions">
        <button id="btn-phase3" class="fd-button fd-button--emphasized">問題を生成する</button>
        <button id="btn-answer-mode" class="fd-button cb-hidden">回答をはじめる</button>
      </div>
      <div id="question-list"></div>
    </div>

    <div id="tab-gaps" class="cb-tabpanel cb-hidden">
      <div id="gap-list"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const PHASES = ["資料", "骨格", "論争", "テスト", "穴", "再テスト"];
const state = { project: null, answering: false, tab: "sources" };

// project.phase is the highest completed phase (Phase 1 done -> phase 1).
// Step 0 （資料） counts as done once any later phase has run.
function stepsHtml(phase) {
  let currentAssigned = false;
  return PHASES.map((label, i) => {
    const done = i === 0 ? phase >= 1 : phase >= i;
    let cls = "";
    if (done) cls = " done";
    else if (!currentAssigned) { cls = " current"; currentAssigned = true; }
    return '<div class="cb-step' + cls + '">' + label + "</div>";
  }).join("");
}

function showError(message) {
  const el = $("#cb-error");
  el.textContent = message || "";
  el.classList.toggle("cb-hidden", !message);
  if (message) window.scrollTo({ top: 0, behavior: "smooth" });
}

async function api(path, options) {
  const res = await fetch(path, options);
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error(data.message || data.error || ("HTTP " + res.status));
  return data;
}

async function busy(button, label, fn) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = label;
  showError("");
  try { return await fn(); }
  catch (e) { showError(e.message); }
  finally { button.disabled = false; button.textContent = original; }
}

/* ---------- projects ---------- */

async function loadProjects() {
  const { projects } = await api("/api/projects");
  const list = $("#project-list");
  list.innerHTML = "";
  for (const project of projects) {
    let gapCount = 0;
    if (project.phase >= 3) {
      try {
        const { gaps } = await api("/api/projects/" + project.id + "/gaps?status=open");
        gapCount = gaps.length;
      } catch (e) { /* count is decorative */ }
    }
    const card = document.createElement("div");
    card.className = "fd-card cb-clickable";
    card.innerHTML =
      '<div class="cb-card-body">' +
      '<h3 class="fd-title fd-title--h3">' + esc(project.name) + "</h3>" +
      '<div class="cb-steps">' + stepsHtml(project.phase) + "</div>" +
      (gapCount > 0 ? '<span class="fd-object-status fd-object-status--negative">未解消の穴 ' + gapCount + "</span>" : "") +
      "</div>";
    card.addEventListener("click", () => openProject(project.id));
    list.appendChild(card);
  }
  if (projects.length === 0) {
    list.innerHTML = '<p class="cb-muted">まだ分野がない。</p>';
  }
}

$("#form-project").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("#input-project-name").value.trim();
  if (!name) return;
  await busy(ev.target.querySelector("button"), "作成中…", async () => {
    await api("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    $("#input-project-name").value = "";
    await loadProjects();
  });
});

/* ---------- project view ---------- */

async function openProject(id) {
  const { project } = await api("/api/projects/" + id);
  state.project = project;
  state.answering = false;
  $("#view-projects").classList.add("cb-hidden");
  $("#view-project").classList.remove("cb-hidden");
  $("#project-name").textContent = project.name;
  renderSteps();
  switchTab("sources");
  await loadSources();
}

function renderSteps() {
  $("#phase-steps").innerHTML = stepsHtml(state.project.phase);
}

$("#btn-back").addEventListener("click", () => {
  state.project = null;
  setAnswering(false);
  $("#view-project").classList.add("cb-hidden");
  $("#view-projects").classList.remove("cb-hidden");
  loadProjects();
});

function switchTab(tab) {
  if (state.answering && tab === "sources") {
    showError("資料ロック中は資料を開けない。");
    return;
  }
  state.tab = tab;
  document.querySelectorAll(".fd-tabs__link").forEach((link) => {
    link.setAttribute("aria-selected", link.dataset.tab === tab ? "true" : "false");
    link.classList.toggle("is-selected", link.dataset.tab === tab);
  });
  document.querySelectorAll(".cb-tabpanel").forEach((panel) => panel.classList.add("cb-hidden"));
  $("#tab-" + tab).classList.remove("cb-hidden");
  if (!state.project) return;
  if (tab === "map") loadMap();
  if (tab === "controversies") loadControversies();
  if (tab === "test") loadQuestions();
  if (tab === "gaps") loadGaps();
}

document.querySelectorAll(".fd-tabs__link").forEach((link) => {
  link.addEventListener("click", () => switchTab(link.dataset.tab));
});

/* ---------- sources (Phase 0) ---------- */

async function loadSources() {
  if (!state.project) return;
  const data = await api("/api/projects/" + state.project.id + "/sources");
  const sources = data.sources || [];
  const el = $("#source-list");
  if (sources.length === 0) {
    el.innerHTML = '<p class="cb-muted">資料がまだない。Markdown かテキストを取り込む。</p>';
    return;
  }
  el.innerHTML = sources.map((s) =>
    '<div class="fd-card cb-node"><div class="cb-card-body">' +
    '<strong>' + esc(s.title) + "</strong>" +
    (s.chunk_count != null ? ' <span class="cb-muted">' + s.chunk_count + " チャンク</span>" : "") +
    "</div></div>"
  ).join("");
}

$("#form-source").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const file = $("#input-source-file").files[0];
  if (!file || !state.project) return;
  const form = new FormData();
  form.append("file", file);
  const title = $("#input-source-title").value.trim();
  if (title) form.append("title", title);
  await busy(ev.target.querySelector("button"), "取り込み中…", async () => {
    await api("/api/projects/" + state.project.id + "/sources", { method: "POST", body: form });
    $("#input-source-file").value = "";
    $("#input-source-title").value = "";
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadSources();
  });
});

/* ---------- skeleton (Phase 1) ---------- */

function citesHtml(citations) {
  const seen = new Set();
  return (citations || [])
    .map((c) => c.chapter || c.source_title || "")
    .filter((label) => {
      if (!label || seen.has(label)) return false;
      seen.add(label);
      return true;
    })
    .map((label) => '<span class="cb-cite">' + esc(label) + "</span>")
    .join("");
}

async function loadMap() {
  if (!state.project) return;
  const { map } = await api("/api/projects/" + state.project.id + "/phases/1");
  const el = $("#map-view");
  if (!map || !map.nodes || map.nodes.length === 0) {
    el.innerHTML = '<p class="cb-muted">骨格がまだない。</p>';
    return;
  }
  const layers = [["foundation", "土台"], ["core", "中核"], ["branch", "枝葉"]];
  let html = "";
  for (const [key, label] of layers) {
    const nodes = map.nodes.filter((n) => n.layer === key);
    if (nodes.length === 0) continue;
    html += '<h2 class="cb-layer fd-title fd-title--h2">' + label + "</h2>";
    html += nodes.map((n) =>
      '<div class="fd-card cb-node"><div class="cb-card-body">' +
      "<strong>" + esc(n.name) + "</strong>" +
      (n.description ? '<p>' + esc(n.description) + "</p>" : "") +
      "<div>" + citesHtml(n.citations) + "</div>" +
      "</div></div>"
    ).join("");
  }
  const nameOf = (id) => (map.nodes.find((n) => n.id === id) || {}).name || id;
  const relLabel = { prerequisite: "前提", causal: "因果", contrast: "対比", part_of: "一部" };
  if (map.edges && map.edges.length > 0) {
    html += '<h2 class="cb-layer fd-title fd-title--h2">関係</h2><ul class="fd-list">' +
      map.edges.map((e) =>
        '<li class="fd-list__item">' + esc(nameOf(e.from_node)) + " —" + esc(relLabel[e.relation] || e.relation) + "→ " + esc(nameOf(e.to_node)) + "</li>"
      ).join("") + "</ul>";
  }
  el.innerHTML = html;
}

$("#btn-phase1").addEventListener("click", async (ev) => {
  await busy(ev.target, "生成中…（数分かかることがある）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/1", { method: "POST" });
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadMap();
  });
});

/* ---------- controversies (Phase 2) ---------- */

async function loadControversies() {
  if (!state.project) return;
  const { controversies } = await api("/api/projects/" + state.project.id + "/phases/2");
  const el = $("#controversy-view");
  if (!controversies || controversies.length === 0) {
    el.innerHTML = state.project.phase >= 2
      ? '<p class="cb-muted">資料内に根本的論争は見当たらない。</p>'
      : '<p class="cb-muted">論争がまだ検出されていない。</p>';
    return;
  }
  el.innerHTML = controversies.map((item) =>
    '<div class="fd-card cb-node"><div class="cb-card-body">' +
    '<h3 class="fd-title fd-title--h3">' + esc(item.topic) + "</h3>" +
    (item.summary ? "<p>" + esc(item.summary) + "</p>" : "") +
    '<div class="cb-two">' + item.positions.map((p) =>
      '<div><strong>' + esc(p.stance) + "</strong>" +
      (p.claims ? "<p><em>主張</em> " + esc(p.claims) + "</p>" : "") +
      (p.evidence ? "<p><em>根拠</em> " + esc(p.evidence) + "</p>" : "") +
      (p.rebuttal ? "<p><em>反論</em> " + esc(p.rebuttal) + "</p>" : "") +
      "<div>" + citesHtml(p.citations) + "</div></div>"
    ).join("") + "</div>" +
    (item.unresolved ? '<p class="cb-muted">未決着の理由: ' + esc(item.unresolved) + "</p>" : "") +
    "</div></div>"
  ).join("");
}

$("#btn-phase2").addEventListener("click", async (ev) => {
  await busy(ev.target, "検出中…（数分かかることがある）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/2", { method: "POST" });
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadControversies();
  });
});

/* ---------- test (Phase 3) ---------- */

const TAG_LABEL = { concept: "概念", causal: "因果", application: "応用", controversy: "論争" };

function setAnswering(on) {
  state.answering = on;
  $("#lockbar").classList.toggle("cb-hidden", !on);
  $("#btn-answer-mode").textContent = on ? "回答をやめる" : "回答をはじめる";
  document.querySelectorAll("#question-list textarea, #question-list .cb-grade-btn").forEach((el) => {
    el.disabled = !on;
  });
}

$("#btn-answer-mode").addEventListener("click", () => setAnswering(!state.answering));

async function loadQuestions() {
  if (!state.project) return;
  const { questions } = await api("/api/projects/" + state.project.id + "/phases/3/questions");
  const el = $("#question-list");
  $("#btn-answer-mode").classList.toggle("cb-hidden", questions.length === 0);
  if (questions.length === 0) {
    el.innerHTML = '<p class="cb-muted">問題がまだない。</p>';
    return;
  }
  el.innerHTML = "";
  questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "fd-card cb-q";
    card.innerHTML =
      '<div class="cb-card-body">' +
      '<span class="cb-cite">' + esc(TAG_LABEL[q.tag] || q.tag) + "</span>" +
      "<p><strong>Q" + (i + 1) + ".</strong> " + esc(q.body) + "</p>" +
      '<textarea class="fd-textarea" placeholder="自分の言葉で答える" disabled></textarea>' +
      '<div class="cb-actions"><button class="fd-button fd-button--emphasized cb-grade-btn" disabled>採点する</button></div>' +
      '<div class="cb-grade-result"></div>' +
      "</div>";
    card.querySelector(".cb-grade-btn").addEventListener("click", async (ev) => {
      const answer = card.querySelector("textarea").value.trim();
      if (!answer) { showError("回答を書いてから採点する。"); return; }
      await busy(ev.target, "採点中…", async () => {
        const result = await api("/api/projects/" + state.project.id + "/phases/3/grade", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question_id: q.id, answer }),
        });
        card.querySelector(".cb-grade-result").innerHTML = gradeHtml(result);
        const { project } = await api("/api/projects/" + state.project.id);
        state.project = project;
        renderSteps();
      });
    });
    el.appendChild(card);
  });
  setAnswering(state.answering);
}

function gradeHtml(result) {
  const g = result.grade;
  const scoreLabel = (v) => v === 2
    ? '<span class="fd-object-status fd-object-status--positive">十分</span>'
    : v === 1
      ? '<span class="fd-object-status fd-object-status--critical">浅い</span>'
      : '<span class="fd-object-status fd-object-status--negative">不足</span>';
  let html = '<div class="cb-score-list">' + Object.entries(g.scores).map(([point, v]) =>
    '<div class="cb-score"><span>' + esc(point) + "</span>" + scoreLabel(v) + "</div>"
  ).join("") + "</div>";
  if (g.missing_points.length > 0) {
    html += "<p><strong>不足</strong></p><ul>" + g.missing_points.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
  }
  if (g.shallow_points.length > 0) {
    html += "<p><strong>浅さ</strong></p><ul>" + g.shallow_points.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
  }
  if (g.followup) html += "<p><strong>追い質問</strong> " + esc(g.followup) + "</p>";
  if (result.model_answer) html += "<p><strong>模範解答</strong> " + esc(result.model_answer) + "</p>";
  if (result.retest) {
    html += result.retest.passed
      ? '<p><span class="fd-object-status fd-object-status--positive">再テスト合格。穴は解消した。</span></p>'
      : '<p><span class="fd-object-status fd-object-status--negative">再テスト不合格。穴は残る。</span></p>';
  } else if (result.gap_opened) {
    html += '<p><span class="fd-object-status fd-object-status--critical">理解の穴として記録した。</span></p>';
  }
  return html;
}

$("#btn-phase3").addEventListener("click", async (ev) => {
  await busy(ev.target, "生成中…（数分かかることがある）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/3/questions", { method: "POST" });
    await loadQuestions();
  });
});

/* ---------- gaps (Phase 4) and retest (Phase 5) ---------- */

const GAP_STATUS = {
  open: '<span class="fd-object-status fd-object-status--negative">未解消</span>',
  retesting: '<span class="fd-object-status fd-object-status--critical">再テスト中</span>',
  closed: '<span class="fd-object-status fd-object-status--positive">解消済み</span>',
};

async function loadGaps() {
  if (!state.project) return;
  const { gaps } = await api("/api/projects/" + state.project.id + "/gaps");
  const el = $("#gap-list");
  if (gaps.length === 0) {
    el.innerHTML = '<p class="cb-muted">穴はない。</p>';
    return;
  }
  el.innerHTML = "";
  for (const gap of gaps) {
    const card = document.createElement("div");
    card.className = "fd-card cb-node";
    let inner =
      '<div class="cb-card-body">' +
      "<strong>" + esc(gap.concept) + "</strong> " + (GAP_STATUS[gap.status] || esc(gap.status)) +
      (gap.detail ? '<p class="cb-detail cb-muted">' + esc(gap.detail) + "</p>" : "");
    if (gap.status === "open") {
      inner += '<div class="cb-actions"><button class="fd-button fd-button--emphasized cb-retest-btn">再テスト</button></div><div class="cb-retest-area"></div>';
    }
    inner += "</div>";
    card.innerHTML = inner;
    const btn = card.querySelector(".cb-retest-btn");
    if (btn) {
      btn.addEventListener("click", async () => {
        await busy(btn, "出題中…", async () => {
          const data = await api("/api/projects/" + state.project.id + "/phases/5/retest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gap_id: gap.id }),
          });
          state.answering = true; // source lock applies to retests too
          const area = card.querySelector(".cb-retest-area");
          area.innerHTML =
            "<p><strong>再テスト</strong> " + esc(data.question.body) + "</p>" +
            '<textarea class="fd-textarea" placeholder="自分の言葉で答える"></textarea>' +
            '<div class="cb-actions"><button class="fd-button fd-button--emphasized cb-retest-grade">採点する</button></div>' +
            '<div class="cb-grade-result"></div>';
          area.querySelector(".cb-retest-grade").addEventListener("click", async (ev2) => {
            const answer = area.querySelector("textarea").value.trim();
            if (!answer) { showError("回答を書いてから採点する。"); return; }
            await busy(ev2.target, "採点中…", async () => {
              const result = await api("/api/projects/" + state.project.id + "/phases/3/grade", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question_id: data.question.id, answer }),
              });
              area.querySelector(".cb-grade-result").innerHTML = gradeHtml(result);
              state.answering = false;
              const { project } = await api("/api/projects/" + state.project.id);
              state.project = project;
              renderSteps();
            });
          });
        });
      });
    }
    el.appendChild(card);
  }
}

loadProjects().catch((e) => showError(e.message));
</script>
</body>
</html>
