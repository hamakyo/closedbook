<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClosedBook</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #fafafa;
    --bg-hover: #f4f4f5;
    --ink: #18181b;
    --ink-2: #52525b;
    --ink-3: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --primary: #18181b;
    --primary-hover: #27272a;
    --primary-fg: #ffffff;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --green: #15803d;
    --green-bg: #f0fdf4;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --radius: 6px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }
  .muted { color: var(--ink-2); }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    appearance: none;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    cursor: pointer;
  }

  /* Layout */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* Typography */
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }
  h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }
  h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
  }
  .prose {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
  }

  /* Controls */
  .row-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) {
    background: var(--bg-hover);
    border-color: var(--border-strong);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-fg);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }
  .btn-ghost {
    border-color: transparent;
    background: transparent;
    color: var(--ink-2);
    height: auto;
    padding: 4px 0;
  }
  .btn-ghost:hover:not(:disabled) {
    background: transparent;
    border-color: transparent;
    color: var(--ink);
  }

  .input {
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    transition: border-color 0.12s;
  }
  .input:focus {
    outline: none;
    border-color: var(--ink);
  }
  .input::placeholder { color: var(--ink-3); }
  input[type="file"].input {
    padding: 5px 8px;
    font-size: 13px;
    color: var(--ink-2);
  }
  textarea.input {
    width: 100%;
    height: auto;
    min-height: 120px;
    padding: 10px 12px;
    resize: vertical;
    line-height: 1.7;
  }
  textarea.input:disabled {
    background: var(--bg-subtle);
    color: var(--ink-3);
  }

  /* Alerts & Empty */
  .alert {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 16px;
    border: 1px solid transparent;
  }
  .alert-error {
    background: var(--red-bg);
    border-color: #fecaca;
    color: var(--red);
  }
  .alert-warn {
    background: var(--amber-bg);
    border-color: #fde68a;
    color: var(--amber);
  }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-2);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-hover);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }

  /* Phase progress (inline strip) */
  .phase-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .phase-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--ink-3);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }
  .phase-pill.done {
    color: var(--green);
    background: var(--green-bg);
    border-color: #bbf7d0;
  }
  .phase-pill.current {
    color: var(--ink);
    background: var(--bg);
    border-color: var(--ink);
    font-weight: 500;
  }

  /* Projects view */
  .page-head {
    margin-bottom: 20px;
  }
  .create-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .create-form .input {
    flex: 1;
    min-width: 0;
  }
  .list-box {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg);
  }
  .project-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .project-row:first-child { border-top: none; }
  .project-row:hover { background: var(--bg-subtle); }
  .project-row-main {
    min-width: 0;
  }
  .project-row-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .project-row-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .chevron {
    color: var(--ink-3);
    font-size: 16px;
    line-height: 1;
  }

  /* Project detail header & tabs */
  .back-bar { margin-bottom: 12px; }
  .proj-head { margin-bottom: 24px; }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    border: none;
    background: none;
    font: inherit;
    font-size: 14px;
    color: var(--ink-2);
    padding: 8px 12px;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.12s;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-selected {
    color: var(--ink);
    border-bottom-color: var(--ink);
    font-weight: 600;
  }
  .tab.is-locked {
    color: var(--ink-3);
    cursor: not-allowed;
  }

  .panel-bar {
    margin-bottom: 16px;
  }

  /* Sources */
  .source-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-subtle);
    margin-bottom: 16px;
  }
  .source-form .input[type="text"] { width: 200px; flex: 1 1 160px; }
  .source-form .input[type="file"] { flex: 1 1 200px; min-width: 0; }
  .flat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .flat-row:first-child { border-top: none; }
  .flat-row-title { font-weight: 500; }
  .flat-row-meta {
    color: var(--ink-2);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Map */
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 28px 0 10px;
  }
  .section-head:first-child { margin-top: 0; }
  .section-count {
    font-size: 12px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .item-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    background: var(--bg);
  }
  .item-desc {
    margin: 6px 0 0;
    color: var(--ink-2);
  }
  .cites {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .cite {
    font-size: 11px;
    color: var(--ink-2);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .rel-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .rel-row:first-child { border-top: none; }
  .rel-name { font-weight: 500; }
  .rel-arrow { color: var(--ink-3); }

  /* Controversies */
  .contro-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .contro-summary {
    margin: 8px 0 0;
    color: var(--ink-2);
  }
  .positions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .position {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .position-stance {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .claim-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
    margin: 10px 0 2px;
  }
  .claim-text {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }
  .unresolved {
    margin-top: 14px;
    margin-bottom: 0;
  }

  /* Test */
  .q-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .q-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .q-body {
    margin: 0 0 14px;
    font-size: 15px;
    line-height: 1.75;
  }
  .q-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  /* Grade */
  .grade {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .score-row:last-of-type { border-bottom: none; }
  .score-point {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .dot-2 { background: var(--green); }
  .dot-1 { background: var(--amber); }
  .dot-0 { background: var(--red); }
  .grade h4 {
    margin: 14px 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .grade ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.7;
  }
  .grade p {
    margin: 4px 0;
    font-size: 13px;
    line-height: 1.75;
  }
  .model-answer {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-top: 6px;
  }
  .model-answer p { margin: 0; }
  .verdict {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
  }
  .verdict-ok { color: var(--green); }
  .verdict-warn { color: var(--amber); }
  .verdict-ng { color: var(--red); }

  /* Gaps */
  .gap-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .gap-concept {
    font-size: 15px;
    font-weight: 600;
  }
  .gap-detail {
    white-space: pre-line;
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.75;
    color: var(--ink-2);
  }
  .retest-area {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .retest-q {
    margin: 0 0 12px;
    font-size: 14px;
    line-height: 1.75;
  }

  @media (max-width: 600px) {
    .main { padding: 24px 16px 64px; }
    .project-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .project-row-meta { width: 100%; justify-content: space-between; }
    .contro-card, .q-card { padding: 16px; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <button id="btn-home" class="brand" type="button">ClosedBook</button>
  </div>
</header>

<main class="main">
  <div id="cb-error" class="alert alert-error hidden" role="alert"></div>

  <!-- Projects -->
  <section id="view-projects">
    <div class="page-head"><h1>分野</h1></div>
    <form id="form-project" class="create-form">
      <input id="input-project-name" class="input" type="text" placeholder="新しい分野の名前" required>
      <button class="btn btn-primary" type="submit">作成</button>
    </form>
    <div id="project-list"></div>
  </section>

  <!-- Project -->
  <section id="view-project" class="hidden">
    <div class="back-bar">
      <button id="btn-back" class="btn btn-ghost" type="button">← 分野一覧</button>
    </div>
    <div class="proj-head">
      <h1 id="project-name"></h1>
      <div id="phase-steps"></div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="sources" role="tab" type="button">資料</button>
      <button class="tab" data-tab="map" role="tab" type="button">骨格</button>
      <button class="tab" data-tab="controversies" role="tab" type="button">論争</button>
      <button class="tab" data-tab="test" role="tab" type="button">テスト</button>
      <button class="tab" data-tab="gaps" role="tab" type="button">穴</button>
    </nav>

    <div id="tab-sources" class="tabpanel">
      <form id="form-source" class="source-form">
        <input id="input-source-title" class="input" type="text" placeholder="タイトル（任意）">
        <input id="input-source-file" class="input" type="file" accept=".md,.txt,.markdown" required>
        <button class="btn btn-primary" type="submit">取り込む</button>
      </form>
      <div id="source-list"></div>
    </div>

    <div id="tab-map" class="tabpanel hidden">
      <div class="row-actions panel-bar">
        <button id="btn-phase1" class="btn btn-primary" type="button">骨格を作る</button>
      </div>
      <div id="map-view"></div>
    </div>

    <div id="tab-controversies" class="tabpanel hidden">
      <div class="row-actions panel-bar">
        <button id="btn-phase2" class="btn btn-primary" type="button">論争を検出する</button>
      </div>
      <div id="controversy-view"></div>
    </div>

    <div id="tab-test" class="tabpanel hidden">
      <div id="lockbar" class="alert alert-warn hidden">
        資料ロック中。回答が終わるまで資料は開けません。
      </div>
      <div class="row-actions panel-bar">
        <button id="btn-phase3" class="btn btn-primary" type="button">問題を生成する</button>
        <button id="btn-answer-mode" class="btn hidden" type="button">回答をはじめる</button>
      </div>
      <div id="question-list"></div>
    </div>

    <div id="tab-gaps" class="tabpanel hidden">
      <div id="gap-list"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const PHASES = ["資料", "骨格", "論争", "テスト", "穴", "再テスト"];
const state = { project: null, answering: false, tab: "sources" };

function phaseLabel(phase) {
  const idx = Math.min(Math.max(Number(phase) || 0, 0), PHASES.length - 1);
  return PHASES[idx];
}

function stepsHtml(phase) {
  let currentAssigned = false;
  const pills = PHASES.map((label, i) => {
    const done = i === 0 ? phase >= 1 : phase >= i;
    let cls = "";
    if (done) cls = " done";
    else if (!currentAssigned) { cls = " current"; currentAssigned = true; }
    const mark = done ? "✓ " : "";
    return '<span class="phase-pill' + cls + '">' + mark + label + "</span>";
  }).join("");
  return '<div class="phase-strip">' + pills + "</div>";
}

function showError(message) {
  const el = $("#cb-error");
  el.textContent = message || "";
  el.classList.toggle("hidden", !message);
  if (message) window.scrollTo({ top: 0, behavior: "smooth" });
}

async function api(path, options) {
  const res = await fetch(path, options);
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error(data.message || data.error || ("HTTP " + res.status));
  return data;
}

async function busy(button, label, fn) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = label;
  showError("");
  try { return await fn(); }
  catch (e) { showError(e.message); }
  finally { button.disabled = false; button.textContent = original; }
}

/* ---------- projects ---------- */

async function loadProjects() {
  const list = $("#project-list");
  if (!list.children.length) list.innerHTML = '<p class="muted">読み込み中…</p>';
  const { projects } = await api("/api/projects");
  if (projects.length === 0) {
    list.innerHTML = '<div class="empty">まだ分野がありません。上の入力欄から作成してください。</div>';
    return;
  }

  const gapCounts = await Promise.all(
    projects.map(async (project) => {
      if (project.phase < 3) return 0;
      try {
        const { gaps } = await api("/api/projects/" + project.id + "/gaps?status=open");
        return gaps.length;
      } catch (e) {
        return 0;
      }
    })
  );

  const box = document.createElement("div");
  box.className = "list-box";
  projects.forEach((project, idx) => {
    const gapCount = gapCounts[idx];
    const row = document.createElement("div");
    row.className = "project-row";
    row.innerHTML =
      '<div class="project-row-main"><div class="project-row-name">' + esc(project.name) + "</div></div>" +
      '<div class="project-row-meta">' +
      (gapCount > 0 ? '<span class="badge badge-red">未解消の穴 ' + gapCount + "</span>" : "") +
      '<span class="badge">' + esc(phaseLabel(project.phase)) + "</span>" +
      '<span class="chevron">›</span></div>';
    row.addEventListener("click", () => openProject(project.id));
    box.appendChild(row);
  });
  list.innerHTML = "";
  list.appendChild(box);
}

$("#form-project").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("#input-project-name").value.trim();
  if (!name) return;
  await busy(ev.target.querySelector("button"), "作成中…", async () => {
    await api("/api/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    $("#input-project-name").value = "";
    await loadProjects();
  });
});

/* ---------- project view ---------- */

async function openProject(id) {
  showError("");
  const { project } = await api("/api/projects/" + id);
  state.project = project;
  setAnswering(false);
  $("#view-projects").classList.add("hidden");
  $("#view-project").classList.remove("hidden");
  $("#project-name").textContent = project.name;
  renderSteps();
  switchTab("sources");
  await loadSources();
}

function goHome() {
  if (!state.project) return;
  showError("");
  state.project = null;
  setAnswering(false);
  $("#view-project").classList.add("hidden");
  $("#view-projects").classList.remove("hidden");
  loadProjects();
}

function renderSteps() {
  $("#phase-steps").innerHTML = stepsHtml(state.project.phase);
}

$("#btn-back").addEventListener("click", goHome);
$("#btn-home").addEventListener("click", goHome);

function switchTab(tab) {
  if (state.answering && tab === "sources") {
    showError("資料ロック中は資料を開けません。");
    return;
  }
  showError("");
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((link) => {
    link.setAttribute("aria-selected", link.dataset.tab === tab ? "true" : "false");
    link.classList.toggle("is-selected", link.dataset.tab === tab);
  });
  document.querySelectorAll(".tabpanel").forEach((panel) => panel.classList.add("hidden"));
  $("#tab-" + tab).classList.remove("hidden");
  if (!state.project) return;
  if (tab === "map") loadMap();
  if (tab === "controversies") loadControversies();
  if (tab === "test") loadQuestions();
  if (tab === "gaps") loadGaps();
}

document.querySelectorAll(".tab").forEach((link) => {
  link.addEventListener("click", () => switchTab(link.dataset.tab));
});

/* ---------- sources (Phase 0) ---------- */

async function loadSources() {
  if (!state.project) return;
  const data = await api("/api/projects/" + state.project.id + "/sources");
  const sources = data.sources || [];
  const el = $("#source-list");
  if (sources.length === 0) {
    el.innerHTML = '<div class="empty">資料がまだありません。Markdown またはテキストを取り込んでください。</div>';
    return;
  }
  el.innerHTML = '<div class="list-box">' + sources.map((s) =>
    '<div class="flat-row"><span class="flat-row-title">' + esc(s.title) + "</span>" +
    (s.chunk_count != null ? '<span class="flat-row-meta">' + s.chunk_count + " チャンク</span>" : "") +
    "</div>"
  ).join("") + "</div>";
}

$("#form-source").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const file = $("#input-source-file").files[0];
  if (!file || !state.project) return;
  const form = new FormData();
  form.append("file", file);
  const title = $("#input-source-title").value.trim();
  if (title) form.append("title", title);
  await busy(ev.target.querySelector("button"), "取り込み中…", async () => {
    await api("/api/projects/" + state.project.id + "/sources", { method: "POST", body: form });
    $("#input-source-file").value = "";
    $("#input-source-title").value = "";
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadSources();
  });
});

/* ---------- skeleton (Phase 1) ---------- */

function citesHtml(citations) {
  const seen = new Set();
  const chips = (citations || [])
    .map((c) => c.chapter || c.source_title || "")
    .filter((label) => {
      if (!label || seen.has(label)) return false;
      seen.add(label);
      return true;
    })
    .map((label) => '<span class="cite">' + esc(label) + "</span>")
    .join("");
  return chips ? '<div class="cites">' + chips + "</div>" : "";
}

async function loadMap() {
  if (!state.project) return;
  const { map } = await api("/api/projects/" + state.project.id + "/phases/1");
  const el = $("#map-view");
  if (!map || !map.nodes || map.nodes.length === 0) {
    el.innerHTML = '<div class="empty">骨格がまだありません。</div>';
    return;
  }
  const layers = [["foundation", "土台"], ["core", "中核"], ["branch", "枝葉"]];
  let html = "";
  for (const [key, label] of layers) {
    const nodes = map.nodes.filter((n) => n.layer === key);
    if (nodes.length === 0) continue;
    html += '<div class="section-head"><h2>' + label + '</h2><span class="section-count">' + nodes.length + "</span></div>";
    html += nodes.map((n) =>
      '<div class="item-card">' +
      '<h3>' + esc(n.name) + "</h3>" +
      (n.description ? '<p class="item-desc prose">' + esc(n.description) + "</p>" : "") +
      citesHtml(n.citations) +
      "</div>"
    ).join("");
  }
  const nameOf = (id) => (map.nodes.find((n) => n.id === id) || {}).name || id;
  const relLabel = { prerequisite: "前提", causal: "因果", contrast: "対比", part_of: "一部" };
  if (map.edges && map.edges.length > 0) {
    html += '<div class="section-head"><h2>関係</h2><span class="section-count">' + map.edges.length + '</span></div><div class="list-box">' +
      map.edges.map((e) =>
        '<div class="rel-row"><span class="rel-name">' + esc(nameOf(e.from_node)) + "</span>" +
        '<span class="badge badge-blue">' + esc(relLabel[e.relation] || e.relation) + "</span>" +
        '<span class="rel-arrow">→</span><span class="rel-name">' + esc(nameOf(e.to_node)) + "</span></div>"
      ).join("") + "</div>";
  }
  el.innerHTML = html;
}

$("#btn-phase1").addEventListener("click", async (ev) => {
  await busy(ev.target, "生成中…（数分かかることがあります）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/1", { method: "POST" });
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadMap();
  });
});

/* ---------- controversies (Phase 2) ---------- */

function claimBlock(label, text) {
  return text ? '<span class="claim-label">' + label + '</span><p class="claim-text">' + esc(text) + "</p>" : "";
}

async function loadControversies() {
  if (!state.project) return;
  const { controversies } = await api("/api/projects/" + state.project.id + "/phases/2");
  const el = $("#controversy-view");
  if (!controversies || controversies.length === 0) {
    el.innerHTML = state.project.phase >= 2
      ? '<div class="empty">資料内に根本的論争は見当たりませんでした。</div>'
      : '<div class="empty">論争がまだ検出されていません。</div>';
    return;
  }
  el.innerHTML = controversies.map((item) =>
    '<div class="contro-card">' +
    "<h3>" + esc(item.topic) + "</h3>" +
    (item.summary ? '<p class="contro-summary prose">' + esc(item.summary) + "</p>" : "") +
    '<div class="positions">' + item.positions.map((p) =>
      '<div class="position"><div class="position-stance">' + esc(p.stance) + "</div>" +
      claimBlock("主張", p.claims) +
      claimBlock("根拠", p.evidence) +
      claimBlock("反論", p.rebuttal) +
      citesHtml(p.citations) +
      "</div>"
    ).join("") + "</div>" +
    (item.unresolved ? '<div class="alert alert-warn unresolved">未決着の理由: ' + esc(item.unresolved) + "</div>" : "") +
    "</div>"
  ).join("");
}

$("#btn-phase2").addEventListener("click", async (ev) => {
  await busy(ev.target, "検出中…（数分かかることがあります）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/2", { method: "POST" });
    const { project } = await api("/api/projects/" + state.project.id);
    state.project = project;
    renderSteps();
    await loadControversies();
  });
});

/* ---------- test (Phase 3) ---------- */

const TAG_LABEL = { concept: "概念", causal: "因果", application: "応用", controversy: "論争" };
const TAG_CLASS = { concept: "badge-blue", causal: "badge-amber", application: "badge-green", controversy: "badge-red" };

function setAnswering(on) {
  state.answering = on;
  $("#lockbar").classList.toggle("hidden", !on);
  $("#btn-answer-mode").textContent = on ? "回答をやめる" : "回答をはじめる";
  const srcTab = document.querySelector('.tab[data-tab="sources"]');
  if (srcTab) srcTab.classList.toggle("is-locked", on);
  document.querySelectorAll("#question-list textarea, #question-list .cb-grade-btn").forEach((el) => {
    el.disabled = !on;
  });
}

$("#btn-answer-mode").addEventListener("click", () => setAnswering(!state.answering));

async function loadQuestions() {
  if (!state.project) return;
  const { questions } = await api("/api/projects/" + state.project.id + "/phases/3/questions");
  const el = $("#question-list");
  $("#btn-answer-mode").classList.toggle("hidden", questions.length === 0);
  if (questions.length === 0) {
    el.innerHTML = '<div class="empty">問題がまだありません。</div>';
    return;
  }
  el.innerHTML = "";
  questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "q-card";
    const tagCls = TAG_CLASS[q.tag] || "";
    card.innerHTML =
      '<div class="q-head"><span class="q-num">Q' + (i + 1) + "</span>" +
      '<span class="badge ' + tagCls + '">' + esc(TAG_LABEL[q.tag] || q.tag) + "</span></div>" +
      '<p class="q-body">' + esc(q.body) + "</p>" +
      '<textarea class="input" placeholder="自分の言葉で回答を書く" disabled></textarea>' +
      '<div class="q-actions"><button class="btn btn-primary cb-grade-btn" type="button" disabled>採点する</button></div>' +
      '<div class="cb-grade-result"></div>';
    card.querySelector(".cb-grade-btn").addEventListener("click", async (ev) => {
      const answer = card.querySelector("textarea").value.trim();
      if (!answer) { showError("回答を書いてから採点してください。"); return; }
      await busy(ev.target, "採点中…", async () => {
        const result = await api("/api/projects/" + state.project.id + "/phases/3/grade", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question_id: q.id, answer }),
        });
        card.querySelector(".cb-grade-result").innerHTML = gradeHtml(result);
        const { project } = await api("/api/projects/" + state.project.id);
        state.project = project;
        renderSteps();
      });
    });
    el.appendChild(card);
  });
  setAnswering(state.answering);
}

function gradeHtml(result) {
  const g = result.grade;
  const scoreLabel = (v) => v === 2
    ? '<span class="badge badge-green">十分</span>'
    : v === 1
      ? '<span class="badge badge-amber">浅い</span>'
      : '<span class="badge badge-red">不足</span>';
  let html = '<div class="grade">' + Object.entries(g.scores).map(([point, v]) =>
    '<div class="score-row"><span class="score-point"><span class="dot dot-' + v + '"></span>' + esc(point) + "</span>" + scoreLabel(v) + "</div>"
  ).join("");
  if (g.missing_points.length > 0) {
    html += "<h4>不足している点</h4><ul>" + g.missing_points.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
  }
  if (g.shallow_points.length > 0) {
    html += "<h4>浅い点</h4><ul>" + g.shallow_points.map((p) => "<li>" + esc(p) + "</li>").join("") + "</ul>";
  }
  if (g.followup) html += "<h4>追い質問</h4><p>" + esc(g.followup) + "</p>";
  if (result.model_answer) html += '<h4>模範解答</h4><div class="model-answer"><p>' + esc(result.model_answer) + "</p></div>";
  if (result.retest) {
    html += result.retest.passed
      ? '<p class="verdict verdict-ok">再テスト合格 — 穴は解消しました。</p>'
      : '<p class="verdict verdict-ng">再テスト不合格 — 穴は残っています。</p>';
  } else if (result.gap_opened) {
    html += '<p class="verdict verdict-warn">理解の穴として記録しました。</p>';
  }
  return html + "</div>";
}

$("#btn-phase3").addEventListener("click", async (ev) => {
  await busy(ev.target, "生成中…（数分かかることがあります）", async () => {
    await api("/api/projects/" + state.project.id + "/phases/3/questions", { method: "POST" });
    await loadQuestions();
  });
});

/* ---------- gaps (Phase 4) and retest (Phase 5) ---------- */

const GAP_STATUS = {
  open: '<span class="badge badge-red">未解消</span>',
  retesting: '<span class="badge badge-amber">再テスト中</span>',
  closed: '<span class="badge badge-green">解消</span>',
};

async function loadGaps() {
  if (!state.project) return;
  const { gaps } = await api("/api/projects/" + state.project.id + "/gaps");
  const el = $("#gap-list");
  if (gaps.length === 0) {
    el.innerHTML = '<div class="empty">記録された穴はありません。</div>';
    return;
  }
  el.innerHTML = "";
  for (const gap of gaps) {
    const card = document.createElement("div");
    card.className = "item-card";
    let inner =
      '<div class="gap-head"><span class="gap-concept">' + esc(gap.concept) + "</span>" +
      (GAP_STATUS[gap.status] || esc(gap.status)) + "</div>" +
      (gap.detail ? '<p class="gap-detail">' + esc(gap.detail) + "</p>" : "");
    if (gap.status === "open") {
      inner += '<div class="row-actions" style="margin-top:12px"><button class="btn btn-primary cb-retest-btn" type="button">再テスト</button></div><div class="retest-area hidden"></div>';
    }
    card.innerHTML = inner;
    const btn = card.querySelector(".cb-retest-btn");
    if (btn) {
      btn.addEventListener("click", async () => {
        await busy(btn, "出題中…", async () => {
          const data = await api("/api/projects/" + state.project.id + "/phases/5/retest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gap_id: gap.id }),
          });
          setAnswering(true);
          const area = card.querySelector(".retest-area");
          area.classList.remove("hidden");
          area.innerHTML =
            '<p class="retest-q">' + esc(data.question.body) + "</p>" +
            '<textarea class="input" placeholder="自分の言葉で回答を書く"></textarea>' +
            '<div class="q-actions"><button class="btn btn-primary cb-retest-grade" type="button">採点する</button></div>' +
            '<div class="cb-grade-result"></div>';
          area.querySelector(".cb-retest-grade").addEventListener("click", async (ev2) => {
            const answer = area.querySelector("textarea").value.trim();
            if (!answer) { showError("回答を書いてから採点してください。"); return; }
            await busy(ev2.target, "採点中…", async () => {
              const result = await api("/api/projects/" + state.project.id + "/phases/3/grade", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question_id: data.question.id, answer }),
              });
              area.querySelector(".cb-grade-result").innerHTML = gradeHtml(result);
              setAnswering(false);
              const { project } = await api("/api/projects/" + state.project.id);
              state.project = project;
              renderSteps();
            });
          });
        });
      });
    }
    el.appendChild(card);
  }
}

loadProjects().catch((e) => showError(e.message));
</script>
